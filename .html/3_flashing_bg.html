<!DOCTYPE html>
<html>
<head><title>Flash!</title></head>
<body>
    <h1 style="color:white; text-align:center;">🚨 HACKED 🚨</h1>
    <script>
        let colors = ['red', 'black', 'green', 'blue'];
        let i = 0;
        setInterval(() => {
            document.body.style.backgroundColor = colors[i % colors.length];
            i++;
        }, 100);
    </script>
</body>
</html>
